services:
  mailpulse:
    image: ghcr.io/syt100/mailpulse:latest
    user: "${MAILPULSE_UID:-10001}:${MAILPULSE_GID:-10001}"
    init: true
    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ../data:/data
    secrets:
      - mailpulse_key
secrets:
  mailpulse_key:
    file: ../secrets/master.key

